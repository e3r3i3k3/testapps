<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.20.2/dist/maplibre-gl.css" />
<link rel="stylesheet" href="https://unpkg.com/@watergis/maplibre-gl-export@4.1.1/dist/maplibre-gl-export.css" />
<style>
    #map {
        width: 100%;
        height: 600px;
    }

    .map-controls {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
        flex-wrap: wrap;
    }

    .map-controls button {
        padding: 10px 20px;
        border: 2px solid #3498db;
        background-color: white;
        color: #3498db;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .map-controls button:hover {
        background-color: #3498db;
        color: white;
    }

    .map-controls button.active {
        background-color: #2980b9;
        color: white;
        border-color: #2980b9;
    }

    .maplibregl-popup {
        max-width: 400px;
    }

    .maplibregl-popup-content {
        padding: 15px;
        border-radius: 10px;
        font-size: 14px;
    }
</style>

<main class="main">
    <div class="content">
        <h1>Test Map (MapLibre)</h1>

        <div style="position: relative;">
            <div id="map"></div>
        </div>

        <div class="map-controls">
            <button (click)="togglePoints()" [class.active]="showPoints">Toggle Points</button>
        </div>
        <div class="map-controls">
            <button (click)="toggleBorders()" [class.active]="showBorders">Toggle Borders</button>
        </div>

    </div>
</main>
