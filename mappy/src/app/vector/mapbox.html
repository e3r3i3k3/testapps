<link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet">
<style>
    #map {
        height: 600px;
    }

    .mapboxgl-popup {
        max-width: 300px;
    }

    .mapboxgl-popup-content {
        padding: 15px;
        border-radius: 10px;
        font-size: 14px;
    }

    button {
        transition: all 0.3s ease;
    }
    button:hover {
        background-color: #3498db !important;
        color: white !important;
    }
    button.active {
        background-color: #2980b9 !important;
        color: white !important;
        border-color: #2980b9 !important;
    }
</style>

<main class="main">
    <div class="content">
        <h1>Mapbox Test Map</h1>
        <div style="position: relative;">
            <div id="map"></div>
            <div style="position: absolute; bottom: 20px; left: 20px; background-color: yellow; padding: 10px; z-index: 1000; font-weight: bold; border: 1px solid black;">
                Test map
            </div>
        </div>
        <div id="green-box-mapbox" style="width: 100%; height: 100px; background-color: green; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-top: 20px;">
            mapbox test
        </div>
        <div style="margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px;">
            <button (click)="exportPdf()"
                    style="padding: 10px 20px; border: 2px solid #e74c3c; background-color: #e74c3c; color: white; border-radius: 5px; cursor: pointer;">
                Export PDF
            </button>
            <button (click)="togglePopulationPng()" 
                    [class.active]="showPopulationPng"
                    style="padding: 10px 20px; border: 2px solid #3498db; background-color: white; color: #3498db; border-radius: 5px; cursor: pointer;">
                {{ showPopulationPng ? 'Hide' : 'Show' }} Population PNG
            </button>
            <button (click)="togglePng2()" 
                    [class.active]="showPng2"
                    style="padding: 10px 20px; border: 2px solid #3498db; background-color: white; color: #3498db; border-radius: 5px; cursor: pointer;">
                {{ showPng2 ? 'Hide' : 'Show' }} s2
            </button>
            <button (click)="toggleStaticPng()" 
                    [class.active]="showStaticPng"
                    style="padding: 10px 20px; border: 2px solid #3498db; background-color: white; color: #3498db; border-radius: 5px; cursor: pointer;">
                {{ showStaticPng ? 'Hide' : 'Show' }} s1
            </button>
            <button (click)="toggleBorders()" 
                    [class.active]="showBorders"
                    style="padding: 10px 20px; border: 2px solid #3498db; background-color: white; color: #3498db; border-radius: 5px; cursor: pointer;">
                {{ showBorders ? 'Hide' : 'Show' }} Borders
            </button>
        </div>
    </div>
</main>
