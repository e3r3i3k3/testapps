<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.20.2/dist/maplibre-gl.css" />
<style>
    #map {
        height: 600px;
    }
    
    .maplibregl-popup {
        max-width: 300px;
    }
    
    .maplibregl-popup-content {
        padding: 15px;
        border-radius: 10px;
    }

    button {
        transition: all 0.3s ease;
    }
    button:hover {
        background-color: #3498db !important;
        color: white !important;
    }
    button.active {
        background-color: #2980b9 !important;
        color: white !important;
        border-color: #2980b9 !important;
    }
</style>

<main class="main">
    <div class="content">
        <h1>Maptiler Test Map</h1>
        <div id="map"></div>
        <div style="margin-top: 15px;">
            <button (click)="toggleRasterLayerEth()" 
                    [class.active]="showRasterLayerEth"
                    style="padding: 10px 20px; border: 2px solid #3498db; background-color: white; color: #3498db; border-radius: 5px; cursor: pointer;">
                {{ showRasterLayerEth ? 'Hide' : 'Show' }} Ethiopia Population GeoTiff
            </button>
            <button (click)="toggleRasterLayerZmb()" 
                    [class.active]="showRasterLayerZmb"
                    style="padding: 10px 20px; border: 2px solid #3498db; background-color: white; color: #3498db; border-radius: 5px; cursor: pointer; margin-left: 10px;">
                {{ showRasterLayerZmb ? 'Hide' : 'Show' }} ZMB Flood GeoTiff
            </button>
            <button (click)="togglePopulationPng()" 
                    [class.active]="showPopulationPng"
                    style="padding: 10px 20px; border: 2px solid #3498db; background-color: white; color: #3498db; border-radius: 5px; cursor: pointer; margin-left: 10px;">
                {{ showPopulationPng ? 'Hide' : 'Show' }} Population PNG
            </button>
            <button (click)="togglePng2()" 
                    [class.active]="showPng2"
                    style="padding: 10px 20px; border: 2px solid #3498db; background-color: white; color: #3498db; border-radius: 5px; cursor: pointer; margin-left: 10px;">
                {{ showPng2 ? 'Hide' : 'Show' }} s2
            </button>
            <button (click)="toggleStaticPng()" 
                    [class.active]="showStaticPng"
                    style="padding: 10px 20px; border: 2px solid #3498db; background-color: white; color: #3498db; border-radius: 5px; cursor: pointer; margin-left: 10px;">
                {{ showStaticPng ? 'Hide' : 'Show' }} s1
            </button>
        </div>
        <div style="margin-top: 15px;">
            <label for="threshold-slider" style="margin-right: 10px;">Threshold: {{ thresholdValue.toFixed(3) }}</label>
            <input id="threshold-slider" type="range" min="0.000001" max=".9999999" step="0.0001" 
                   [value]="thresholdValue" 
                   (input)="onThresholdChange($event)"
                   style="width: 300px; vertical-align: middle;">
        </div>
        <div style="margin-top: 15px;">
            <img src="image/eth_pd_2020_1km_UNadj.png" alt="Ethiopia Population Density 2020" style="max-width: 100%; height: auto; border: 1px solid #ccc;">
        </div>
    </div>
</main>
