<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.7.0/ol.css" />
<style>
    #ol-map {
        width: 100%;
        height: 600px;
    }

    .map-controls {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
        flex-wrap: wrap;
    }

    .map-controls button {
        padding: 10px 20px;
        border: 2px solid #3498db;
        background-color: white;
        color: #3498db;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .map-controls button:hover {
        background-color: #3498db;
        color: white;
    }

    .map-controls button.active {
        background-color: #2980b9;
        color: white;
        border-color: #2980b9;
    }

    .ol-popup {
        position: absolute;
        background-color: white;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #cccccc;
        bottom: 12px;
        left: -50px;
        min-width: 280px;
        max-width: 400px;
        font-size: 14px;
    }

    .ol-popup:after,
    .ol-popup:before {
        top: 100%;
        border: solid transparent;
        content: " ";
        height: 0;
        width: 0;
        position: absolute;
        pointer-events: none;
    }

    .ol-popup:after {
        border-top-color: white;
        border-width: 10px;
        left: 48px;
        margin-left: -10px;
    }

    .ol-popup:before {
        border-top-color: #cccccc;
        border-width: 11px;
        left: 48px;
        margin-left: -11px;
    }

    .ol-popup-closer {
        text-decoration: none;
        position: absolute;
        top: 2px;
        right: 8px;
        font-size: 20px;
        color: #999;
    }

    .ol-popup-closer:after {
        content: "✖";
    }

    .ol-popup-closer:hover {
        color: #333;
    }
</style>

<main class="main">
    <div class="content">
        <h1>Test Map</h1>
        <div style="position: relative;">
            <div id="ol-map"></div>
            <div style="position: absolute; bottom: 20px; left: 20px; background-color: yellow; padding: 10px; z-index: 1000; font-weight: bold; border: 1px solid black;">
                Test export UI
            </div>
        </div>
        <div id="green-box" style="width: 100%; height: 500px; background-color: green; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-top: 20px;">
            test test test BBBBBBBB
        </div>

        <div class="map-controls">
             <button (click)="exportPdf()" style="background-color: #e74c3c; color: white !important; border-color: #c0392b;">Export PDF</button>
        </div>

        <div class="map-controls">
            <button (click)="togglePoints()">Toggle Points</button>
        </div>
        <div class="map-controls">
            <button (click)="toggleBorders()">Toggle Borders</button>
        </div>
        <div class="map-controls">
            <button (click)="toggleGreenDots()">Toggle Green Dots</button>
        </div>
        <div class="map-controls">
            <button (click)="toggleHospitals()">Toggle Kenya Hospitals</button>
        </div>
        <div class="map-controls">
            <button (click)="togglePng2()" [class.active]="showPng2">Toggle Flood Processing</button>
        </div>

    </div>
</main>
